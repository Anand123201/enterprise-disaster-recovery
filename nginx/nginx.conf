events {
    worker_connections 1024;
}

http {
    upstream production_backend {
        server green:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://production_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}