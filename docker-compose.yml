
services:
  db:
    image: postgres:16
    container_name: recovery-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: enterprise_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d enterprise_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app1:
    build: .
    container_name: recovery-app1
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: enterprise_db
      SERVER_NAME: Primary Server
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app2:
    build: .
    container_name: recovery-app2
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: enterprise_db
      SERVER_NAME: Backup Server
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: recovery-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped

volumes:
  postgres_data:
